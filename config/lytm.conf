# LocalYTManager — configuration
#
# This file is NEVER overwritten once it exists. The installer creates it on
# first run only; every later run preserves it verbatim. That is what keeps the
# chosen port stable across reinstalls and upgrades.

# HTTP port. Pi-hole owns 80/443/53 and RumblingPodcast owns 8088.
port = 8090

# Bind address. 0.0.0.0 = reachable from the LAN.
bind = 0.0.0.0

# Days before a downloaded file is auto-erased from disk.
retention_days = 7

# Maximum simultaneous downloads. 1 by default: this Pi has ~150MB free RAM and
# yt-dlp + ffmpeg are the heavy steps. Raise only if you have headroom.
max_parallel_downloads = 1

# Where completed media lands (relative to the install dir).
media_dir = data/media

# Where cached thumbnails land (relative to the install dir).
thumb_dir = data/thumbs

# yt-dlp binary. Empty = auto-detect. Auto-detect prefers, in order:
#   1. this tool's own path in bin/yt-dlp
#   2. /opt/rumblingpodcast/bin/yt-dlp
#   3. yt-dlp on $PATH
#
# bin/yt-dlp is a symlink to /opt/rumblingpodcast/bin/yt-dlp. RumblingPodcast
# owns that binary and updates it with `rp update`, which swaps the file via an
# atomic rename - the symlink picks the new version up on its own, so there is
# nothing to update or restart here. Set this key only if you want a completely
# separate binary.
ytdlp_path =

# Extra args appended to every yt-dlp download, space separated.
# Example: --extractor-args "youtube:player_client=android"
ytdlp_extra_args =

# Scheduler priority for the worker. Nice value, 19 = lowest priority.
worker_nice = 19